<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - FAST Computer SME</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">FC</div>
      <h1>FAST COMPUTER SME</h1>
      <p>Hệ thống Quản lý Bán hàng Linh kiện PC & Kế toán</p>
    </div>

    <div id="errorBox" class="alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập..." required />
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Đăng nhập hệ thống</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      const btn = document.getElementById('btnLogin');
      errorBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errorBox.textContent = 'Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang xác thực...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'Đăng nhập thất bại.';
          errorBox.style.display = 'block';
        } else {
          window.location.href = '/admin';
        }
      } catch (err) {
        errorBox.textContent = 'Không thể kết nối đến máy chủ.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Đăng nhập hệ thống';
      }
    });
  </script>
</body>
</html>
